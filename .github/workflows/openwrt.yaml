name: Generate Vanilla OpenWrt Config

on:
  workflow_dispatch:

env:
  DEVICE_CONFIG: jidu6j01.config

jobs:
  vanilla-config:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore dl cache
        uses: actions/cache@v4
        with:
          path: dl-cache
          key: ${{ runner.os }}-openwrt-dl-v25.12.5
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-

      - name: Make script executable
        run: chmod +x openwrt.sh

      - name: Generate vanilla config
        env:
          DEVICE_CONFIG: ${{ env.DEVICE_CONFIG }}
        run: ./openwrt.sh

      - name: Upload comparison files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-config-comparison
          compression-level: 9
          if-no-files-found: error
          path: |
            /tmp/vanilla-jidu6j01.config
            /tmp/vanilla-diff.txt
