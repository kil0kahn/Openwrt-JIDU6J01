name: Openwrt Build for JIDU6101 and JIDU6J01

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        device:
          - name: jidu6101
            config: configs/.config-jidu6101

          - name: jidu6j01 # jidu6201/6401/6601/6701
            config: configs/.config-jidu6j01

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free up disk space on runner
      run: |
        echo "Before cleanup:"
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache \
          /usr/local/.ghcup /opt/az /usr/lib/jvm /usr/local/share/powershell \
          /usr/share/swift /opt/microsoft
        sudo docker image prune -a -f || true
        sudo apt-get clean
        echo "After cleanup:"
        df -h /

    - name: Cache openwrt build tree (sources, toolchain, ccache)
      uses: actions/cache@v4
      with:
        path: openwrt
        # unique key per run so this run's cache gets SAVED at the end -
        # actions/cache skips saving on an exact key match, so a static
        # key would silently stop updating after the first successful run
        key: openwrt-${{ matrix.device.name }}-${{ github.run_id }}
        # prefix match restores the most recent cache for this device,
        # regardless of which run produced it
        restore-keys: |
          openwrt-${{ matrix.device.name }}-

    - name: Disk space after cache restore
      run: df -h /

    - name: Do Build
      env:
        DEVICE_CONFIG: ${{ matrix.device.config }}
      run: chmod +x openwrt.sh; bash openwrt.sh

    - name: Build Summary
      if: always()
      run: |
        cd openwrt

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  🖥️  Runner Info"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  OS      : $(lsb_release -ds)"
        echo "  CPU     : $(nproc) cores"
        echo "  RAM     : $(free -h | awk '/^Mem/{print $2}') total / $(free -h | awk '/^Mem/{print $7}') available"
        echo "  Disk    : $(df -h . | awk 'NR==2{print $4}') free of $(df -h . | awk 'NR==2{print $2}')"

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  🎯 Build Target"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  Target  : $(grep 'CONFIG_TARGET_BOARD' .config | cut -d= -f2 | tr -d '\"')"
        echo "  Subtarget: $(grep 'CONFIG_TARGET_SUBTARGET' .config | cut -d= -f2 | tr -d '\"')"
        echo "  Profile : $(grep 'CONFIG_TARGET_PROFILE' .config | cut -d= -f2 | tr -d '\"')"
        echo "  Kernel  : $(grep 'CONFIG_LINUX_' .config | grep '=y' | cut -d_ -f3- | tr -d '='| tr -d 'y' | sed 's/_/./g')"

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📜 Git Commits (last 5)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        git log --oneline -5

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📦 Build Artifacts"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        tree -L 1 bin/targets/mediatek/filogic/

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📏 Image Sizes"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        ls -lh bin/targets/mediatek/filogic/*.bin 2>/dev/null | awk '{print "  " $5 "  " $9}'

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📦 Selected Packages Count"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  Total   : $(grep '^CONFIG_PACKAGE_.*=y' .config | wc -l) packages"

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📊 ccache Stats"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        staging_dir/host/bin/ccache -vv --show-stats

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  🌐 Feeds"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        cat feeds.conf.default

        echo ""

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-${{ matrix.device.name }}
        path: |
          openwrt/bin/targets/mediatek/filogic/openwrt*.bin
          openwrt/bin/targets/mediatek/filogic/openwrt*.ubi
          openwrt/bin/targets/mediatek/filogic/sha256sums
